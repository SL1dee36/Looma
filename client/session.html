<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Session</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/session.css">
    <!-- <link rel="stylesheet" href="css/active-sessions.css">  Если создашь отдельные CSS файлы -->
    <!-- <link rel="stylesheet" href="css/my-sessions.css"> -->
</head>
<body>
    <header>
        <div class="logo"><a href="index.html" id="logo-link">Cine<span class="sync-part">Sync</span></a></div>
        <div class="user-profile" id="user-profile">
            <div class="user-icon" id="user-icon"></div>
            <div class="dropdown-content" id="dropdown-content">
                <a href="#" id="active-sessions-link">Active Sessions</a>
                <div class="active-sessions-panel" style="display: none;">
                    <!-- Список активных сессий будет здесь -->
                </div>
                <a href="#" id="my-sessions-link">My Sessions</a>
                  <div class="my-sessions-panel" style="display: none;">
                    <!-- Список сессий пользователя будет здесь -->
                </div>
                <a href="#" id="logout-link">Logout</a>
            </div>
        </div>
    </header>

    <main>
        <div class="video-player-container">
            <div id="player"></div> <!-- YouTube player will go here -->
        </div>
        <div class="content-area">
            <div class="chat-container">
                <h2>Chat</h2>
                <div id="chat-messages">
                    <!-- Messages will be added here -->
                </div>
                <div class="board">
                    <input type="text" id="message-input" placeholder="Type your message...">
                    <button id="send-message-btn">
                        <svg width="40px" height="40px" viewBox="0 0 40 30" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M6.99811 10.2467L7.43298 11.0077C7.70983 11.4922 7.84825 11.7344 7.84825 12C7.84825 12.2656 7.70983 12.5078 7.43299 12.9923L7.43298 12.9923L6.99811 13.7533C5.75981 15.9203 5.14066 17.0039 5.62348 17.5412C6.1063 18.0785 7.24961 17.5783 9.53623 16.5779L15.8119 13.8323C17.6074 13.0468 18.5051 12.654 18.5051 12C18.5051 11.346 17.6074 10.9532 15.8119 10.1677L9.53624 7.4221C7.24962 6.42171 6.1063 5.92151 5.62348 6.45883C5.14066 6.99615 5.75981 8.07966 6.99811 10.2467Z" fill="#fff"/>
                        </svg>
                    </button>
                </div>
            </div>

            <div class="session-settings">
                <div class="owner-settiongs">
                <h2>Session Settings (Owner Only)</h2>
                    <!-- Video URL input -->
                    <div>
                        <label for="video-url">Video URL:</label>
                        <input type="text" id="video-url" placeholder="Enter YouTube URL">
                    </div>
                    <!-- REMOVE:  isPlaying checkbox -->
                    <!-- REMOVE: Playback Position input -->

                    <button id="update-content-btn">Set Initial Video</button> <!--  Keep this button -->
                </div>
                <p class="error-message" id = "update-content-error-message"></p>
                 <div id="room-info">
                    <p>Room Code: <span id="room-code"></span></p>
                    <p>Owner: <span id="room-owner"></span></p>
                 </div>
                <button id="leave-room-btn">Leave Room</button>
                <button id="delete-room-btn">Delete Room</button> <!-- Only visible to owner -->
            </div>
        </div>
    </main>

    <footer>
        <p>© 2025 CineSync. All rights reserved.</p>
    </footer>

    <div id="custom-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal-btn">×</span>
            <p id="modal-text"></p>
            <div id="modal-buttons">
                <button id="modal-confirm-btn">Confirm</button>
                <button id="modal-cancel-btn">Cancel</button>
            </div>
        </div>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script> <!-- YouTube API -->
    <script src="js/utils.js"></script>
    <script src="js/session.js"></script>
</body>
</html>
